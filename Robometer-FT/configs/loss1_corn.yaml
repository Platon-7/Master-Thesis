# Loss 1: asymmetric CORN on per-frame ordinal labels (see Robometer-LoRA/losses.md
# §Loss 1). Apply on top of train_base.yaml — this preset is identical to
# Robometer-LoRA/configs/loss1_corn.yaml; the LoRA-vs-full-FT axis is set in
# train_base.yaml (model.use_peft), not here.

# Head architecture: a fresh 4-logit CORN head (no sigmoid — handled inside the
# loss). Output dim 4 differs from Robometer-4B's 10-bin progress head, so the
# head starts random-init even when load_from_checkpoint loads the rest of the
# weights. The backbone still benefits from the Robometer pretraining.
model.progress_head_mode: corn

# Loss selection.
loss.progress_loss_type: corn_asymmetric
loss.corn_asymmetric_c: 1.5   # alpha_k = 1 + 1.5 * (k-2) → (1, 2.5, 4, 5.5) for k=2..5

# Active heads for this variant.
model.train_progress_head: true
model.train_success_head: false
model.train_preference_head: false

# Label pipeline:
#   * Failures — raw rubric decimals {0, 0.25, 0.5, 0.75}, no smoothing.
#   * Successes — bucketized to nearest 25-quantile by the sampler, then
#     optional per-frame Gaussian noise on interior frames only (endpoints
#     pinned to 0.0 and 1.0 for stable CORN threshold supervision).
data.failure_label_smoothing: none
data.success_label_noise_std: 0.1   # ~1–3 label flips per 16-frame success traj

# Stratified 50/50 fail/success batches from step 0 (no failure-only warmup).
# Matches the Apr-30 LoRA bake-off decision.
data.stratified_batch_balance: false   # paper-faithful: uniform sampling, natural class distribution
data.warmup_steps: 0

training.exp_name: robometer_ft_loss1_corn_asymmetric
