# LRM (TRI/USC-PSI) absolute-progress baseline, Qwen3-VL-8B ('progress' subfolder).
# Served by utils/baseline_reward_adapters.py. use_relative_rewards=true because
# vlm_ibrl runs it in delta mode by default (robosuite_vlm_env.py:733-735).
# Key set mirrors robometer.yaml so no config read can KeyError.

add_estimated_reward: false
batch_size: 4
eval_server_port: 8000
eval_server_timeout: 120.0
eval_server_url: http://localhost
icl_demo_path: null
max_workers: 1
model_path: USC-PSI-Lab/LRM-models
model_type: lrm
normalize_reward: false
normalize_warmup: 1000
normalize_window: 10000
num_gpus: 1
potential_gamma: 0.99
potential_scale: 1.0
progress_as_potential: false
progress_beta: 1.0
progress_binarize_threshold: null
success_detection_duration: 1
success_detection_min_ep_steps: 0
success_detection_threshold: 0.65
use_relative_rewards: true
use_success_detection: false
