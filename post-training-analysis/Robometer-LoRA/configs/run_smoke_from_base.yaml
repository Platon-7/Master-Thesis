# SMOKE: train from Robometer-4B base on tar/JPG path. Same recipe as run14
# (L2 λ=0.3 + KL=0.3) but starts from base instead of step-3000 ckpt. Tests
# whether the failure is path-mismatch (resume from MP4-trained ckpt) or
# something deeper.
#
# 1000 steps → at least one eval at step 500 (custom_eval_steps=500). If
# eval_p_rank/ranking_acc_failure_vs_successful >> 0.5, the new tar path is
# fine for fresh starts and the bug is the cross-codec resume.
loss.asymmetric_lambda: 0.3
loss.failure_kl_weight: 0.3
loss.failure_kl_buffer_size: 10
loss.failure_kl_apply_when_buffer_below_size: true
loss.failure_kl_apply_every_n_success: 1
loss.failure_kl_concat_batch: false
loss.failure_kl_detach_backbone: false
training.load_from_checkpoint: robometer/Robometer-4B
training.learning_rate: 2.0e-5
training.warmup_ratio: 0.05
training.max_steps: 1000
training.exp_name: smoke_from_base_tar_jpg
