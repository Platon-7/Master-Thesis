# Loss 1: asymmetric CORN on per-frame ordinal labels (see losses.md §Loss 1).
# Apply on top of train_lora_base.yaml:
#   uv run python train.py --config-path=../Robometer-LoRA/configs/train_lora_base.yaml \
#       --config-path=../Robometer-LoRA/configs/loss1_corn.yaml \
#       <any extra overrides>
#
# Head architecture: a fresh 4-logit CORN head (no sigmoid — handled inside the loss). Since
# the output dim (4) differs from the Robometer-4B progress head (10), the head starts
# random-init; the backbone still benefits from pretraining.
#
# Only the progress head trains. Success + preference heads are disabled — losses.md Loss 1
# replaces all three existing heads with the single CORN head.

# Head shape.
model.progress_head_mode: corn

# Loss selection.
loss.progress_loss_type: corn_asymmetric
loss.corn_asymmetric_c: 1.5   # alpha_k = 1 + 1.5 * (k-2) → (1, 2.5, 4, 5.5) for k=2..5

# Active heads for this variant.
model.train_progress_head: true
model.train_success_head: false
model.train_preference_head: false

# Label pipeline on the data side:
#   * Failures — raw rubric decimals {0, 0.25, 0.5, 0.75}, no smoothing.
#   * Successes — bucketized to nearest 25-quantile by the sampler when progress_loss_type
#     is corn_asymmetric, then optional per-frame Gaussian noise on interior frames only
#     (endpoints pinned to 0.0 and 1.0 for stable CORN threshold supervision).
data.failure_label_smoothing: none
data.success_label_noise_std: 0.1   # ~1–3 label flips per 16-frame success trajectory

# Two-phase training: 2k steps of failure-only warmup, then exact 50/50 fail/success batches
# for the remainder. Loss 1's longer warmup (vs Loss 2's 1k) reflects its bigger architectural
# departure — fresh CORN head needs more pre-exposure to the failure distribution before the
# success side enters.
data.stratified_batch_balance: true
# Warmup disabled (was 750). Apr-30 decision: skip the failure-only bootstrap phase,
# go straight to 50/50 stratified batches from step 0. The `robometer_frames_warmup`
# dataset is correspondingly dropped from data.train_datasets in train_lora_base.yaml.
data.warmup_steps: 0

training.exp_name: robometer_lora_loss1_corn_asymmetric
