# Run 6 — Qwen3.5-FT (850k full train pool) WITHOUT ICL, ORIGINAL Robometer loss.
# Same recipe as run3_noicl_standard.yaml in Robometer-FT; differs only in:
#   * data.train_datasets = robometer_frames_train (850k full pool)
#   * training.learning_rate = 2.0e-5 (pretraining stage)
#   * exp_name = qwen35_ft_run6_noicl_standard
#
# Goal: ablation baseline for Qwen3.5 pretraining. Matches runs 4/5 in every
# axis except the loss formulation. See run3 yaml for the full rationale.

data.train_datasets: [robometer_frames_train]

# Plain (non-asymmetric) discrete C51 + Robometer's class-balanced BCE.
loss.progress_loss_type: discrete
loss.success_loss_type: bce_balanced
loss.progress_discrete_bins: 10

# No KL anchor.
loss.failure_kl_weight: 0.0

# Heads — progress + success on, preference OFF (user-confirmed).
model.train_progress_head: true
model.train_success_head: true
model.train_preference_head: false

# Sampler — "paper-faithful" here means the LOSS MATH (plain discrete + class-
# balanced BCE, no KL anchor, no asymmetric weighting); the DATA is ours (850k
# full pool with per-frame failure labels feeding both heads). Once failures
# are in the loss, the data-imbalance fixes from runs 4/5 (failure oversample
# to 30% batch share; metaworld success oversample to lift coverage from <1×
# to ~3× per success) are NECESSARY accompaniments to our data choice, not
# part of the loss recipe. So the ablation isolates ONLY the loss-formulation
# delta against run 5; data exposure is held equal.
data.sample_type_ratio: [0,1,0]
data.stratified_batch_balance: false
data.failure_oversample_factor: 2.61    # → 30% failure batch-fraction (natural 14.1%) — matches runs 4/5
data.warmup_steps: 0
data.failure_label_smoothing: linear
data.success_oversample_per_source.metaworld: 13.0    # data-exposure fix; see runs 4/5 for rationale
data.failure_oversample_per_source.droid: 3.0      # boost droid failures (6k vs 155k succ → succ:fail within droid 91:9 → 64:36)

# Keep the ~13.6k orphan-task failures (tasks with no successful demo).
data.keep_orphan_task_failures: true

# ICL off.
data.use_icl: false
data.icl_prob: 0.0

training.learning_rate: 2.0e-5

training.exp_name: qwen35_ft_run6_noicl_standard
