# Run 4 PHASE 2 — Qwen3.5-FT fine-tune, continues from Phase 1's consolidated
# checkpoint. Same recipe as run4_icl_ours.yaml EXCEPT:
#   * training.learning_rate: 1.0e-5  (was 2.0e-5 in phase 1 — lower LR for finetune)
#   * training.max_steps:    5000     (was 6500)
#   * training.exp_name:     ..._phase2
#
# Phase 1 checkpoint must be consolidated to HF format first (see
# jobs/consolidate_phase1.job). The resulting HF dir is then passed to this
# yaml's run via `++training.load_from_checkpoint=<hf_dir>`, set by the
# Phase 2 job script from the LOAD_FROM_CKPT env var.
#
# Apply on top of train_base.yaml via jobs/run4_icl_ours_phase2.job.

data.train_datasets: [robometer_frames_train_no_extras]

# Loss 2.
loss.progress_loss_type: c51_asymmetric
loss.success_loss_type: bce_asymmetric
loss.progress_discrete_bins: 10
loss.asymmetric_lambda: 0.3

# KL anchor.
loss.failure_kl_weight: 0.0
loss.failure_kl_buffer_size: 10
loss.failure_kl_apply_when_buffer_below_size: true
loss.failure_kl_apply_every_n_success: 1
loss.failure_kl_concat_batch: false
loss.failure_kl_detach_backbone: false

# Heads.
model.train_progress_head: true
model.train_success_head: true
model.train_preference_head: false

# Sampler — same as phase 1.
data.sample_type_ratio: [0,1,0]
data.stratified_batch_balance: false
data.failure_oversample_factor: 1.89    # → 30% failure batch-fraction (natural 18.5% of no_extras pool)
data.success_oversample_per_source.metaworld: 13.0
data.failure_oversample_per_source.droid: 3.0      # boost droid failures (6k vs 155k succ → succ:fail within droid 91:9 → 64:36)
data.warmup_steps: 0
data.failure_label_smoothing: linear

# Keep the ~13.6k orphan-task failures.
data.keep_orphan_task_failures: true

# Phase 2 finetune LR — half of phase 1's 2e-5.
training.learning_rate: 1.0e-5

# Phase 2 step budget — 5000 additional steps on top of phase 1's 6500.
training.max_steps: 5000

training.exp_name: qwen35_ft_run4_icl_ours_phase2
