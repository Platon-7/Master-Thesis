# Run 4 — Qwen3.5-FT (850k full train pool, incl. humanoid + human_hand)
# WITH ICL + our loss recipe. This is a PRETRAINING stage; a second fine-tuning
# step with lower LR is planned afterwards to match runs 1/2/3.
#   * Loss: asymmetric C51 + asymmetric BCE, lambda=0.3, KL anchor weight=0.1
#   * Active heads: progress + success
#   * sample_type_ratio = [0,1,0] (failures kept via patched base.py escape hatch)
#   * stratified_batch_balance = true (50/50 batches so KL fires)
#   * ICL: on
#   * LR = 2e-5 (higher than runs 1/2/3 since this is pretraining from vanilla Qwen3.5)

# Data pool — 850k full pool (includes humanoid + human_hand extras).
data.train_datasets: [robometer_frames_train]

# Loss 2.
loss.progress_loss_type: c51_asymmetric
loss.success_loss_type: bce_asymmetric
loss.progress_discrete_bins: 10
loss.asymmetric_lambda: 0.3

# KL anchor.
loss.failure_kl_weight: 0.0
loss.failure_kl_buffer_size: 10
loss.failure_kl_apply_when_buffer_below_size: true
loss.failure_kl_apply_every_n_success: 1
loss.failure_kl_concat_batch: false
loss.failure_kl_detach_backbone: false

# Heads.
model.train_progress_head: true
model.train_success_head: true
model.train_preference_head: false

# Sampler.
data.sample_type_ratio: [0,1,0]
data.stratified_batch_balance: false
data.failure_oversample_factor: 2.61    # → 30% failure batch-fraction (natural 14.1%)
# Per-source SUCCESS boost. Without this, metaworld successes (only 1,946 in the
# pool vs 27,010 failures) get <0.1 visits each in 3000 steps. 13× pushes
# expected visits to ~3 per success over a 7500-step run (~94% unique coverage).
# Only sampler weights are affected; no change to the loss / model.
data.success_oversample_per_source.metaworld: 13.0
data.failure_oversample_per_source.droid: 3.0      # boost droid failures (6k vs 155k succ → succ:fail within droid 91:9 → 64:36)
data.warmup_steps: 0
data.failure_label_smoothing: linear

# Keep the 13,610 orphan-task failures (mostly roboarena/failsafe). Phase 1 was
# trained with the filter active; Phase 2 picks this up via this yaml.
data.keep_orphan_task_failures: true

training.learning_rate: 2.0e-5

# Phase-1 step count: 6500 pretrain steps. Phase 2 will load this checkpoint and
# train for an additional 5000 steps at a lower LR (separate sbatch invocation
# with ++training.load_from_checkpoint=... ++training.max_steps=5000 ++training.learning_rate=1e-5).
training.max_steps: 6500

training.exp_name: qwen35_ft_run4_icl_ours_phase1
