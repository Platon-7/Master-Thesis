# Loss 1: asymmetric CORN on per-frame ordinal labels (see Robometer-LoRA/losses.md §Loss 1).
# Both Loss 1 and Loss 2 are wired and ready — final choice comes from the LoRA bake-off.
#
# Apply on top of Qwen35-FT/configs/train_base.yaml:
#   sbatch Qwen35-FT/jobs/train_loss1.job

# Head shape.
model.progress_head_mode: corn

# Loss selection.
loss.progress_loss_type: corn_asymmetric
loss.corn_asymmetric_c: 1.5

# Active heads for this variant.
model.train_progress_head: true
model.train_success_head: false
model.train_preference_head: false

data.failure_label_smoothing: none
data.success_label_noise_std: 0.1

data.stratified_batch_balance: false   # paper-faithful: uniform sampling, natural class distribution
data.warmup_steps: 0

training.exp_name: qwen35_ft_loss1_corn_asymmetric
