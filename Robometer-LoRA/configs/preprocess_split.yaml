# Preprocess config for one robometer_frames split.
# The split name is parameterised via the SPLIT environment variable so the same file
# serves all five splits (train, eval_droid, eval_robometer, eval_metaworld, eval_failsafe).
#
# Pipeline:
#   1) generate_hf_dataset writes  $HF_DIR/${SPLIT}_raw/robometer_frames_${SPLIT}/
#   2) this config tells preprocess_datasets where to find that dataset and where to
#      cache the training-ready pickles.
#
# Required env at runtime:
#   SPLIT                                 — train | eval_droid | eval_robometer | eval_metaworld | eval_failsafe
#   ROBOMETER_PROCESSED_DATASETS_PATH    — destination for the training-ready cache
#   HF_DIR                               — output_dir from step (1); defaults to /scratch-shared/$USER/robometer_frames_hf
#
# Run via:
#   SPLIT=train sbatch jobs/preprocess_split.job
# (the job script exports the env vars and points preprocess_datasets at this file)

train_datasets:
  - ${oc.env:HF_DIR}/${oc.env:SPLIT}_raw

train_subsets:
  - ["robometer_frames_${oc.env:SPLIT}"]

# Each split is processed independently — eval_* configs don't need to pre-bundle other
# splits into the same cache. Leave eval lists empty so preprocess_datasets just builds the
# train-side cache for the given SPLIT (its naming is otherwise misleading; it really just
# means "build a cache for these dataset names").
eval_datasets: []
eval_subsets: []

# Match the dataset's native frame count — keyframes are pre-extracted at 16/episode.
max_frames_for_preprocessing: 16
video_frame_sampling: "uniform"
num_proc: 1
num_threads: 16
# Cached-path detection is flaky when a prior run failed mid-cache-write (marks the dir as
# existing without a usable processed_dataset inside). Force reprocess — cheap at ~500 ep.
force_reprocess: false

cache_dir: ${oc.env:ROBOMETER_PROCESSED_DATASETS_PATH}

# Skip embedding precomputation — the LoRA bake-off uses the live VLM forward, not
# pre-baked DINOv2/sentence embeddings.
precompute_embeddings: false
