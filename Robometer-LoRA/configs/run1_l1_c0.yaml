# Bake-off Run 1 — L1 (CORN) symmetric baseline.
# Apply on top of train_lora_base.yaml + loss1_corn.yaml. Overrides only what differs:
#   * c=0 → α_k=1 for all k → fully symmetric BCE-style CORN loss (loss1_corn.yaml default is 1.5).
#   * lr=4e-5 (2× the base's 2e-5) per the May-1 bake-off spec — L1 runs use a higher lr.
#   * ICL task-instruction dropout: OFF (default; not set).

loss.corn_asymmetric_c: 0.0
training.learning_rate: 4.0e-5
# 4000 steps (down from base's 7500) — past runs plateaued well before 7500.
training.max_steps: 4000
training.exp_name: bakeoff_run1_l1_c0
