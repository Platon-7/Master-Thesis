# CORN head pretraining (head-only, backbone frozen, no LoRA).
#
# Goal: warm-start the fresh 4-logit CORN head so its outputs span [0, 1] across
# rubric labels y=1..5 BEFORE LoRA bake-off ablations apply asymmetry on top.
# Without this pretraining the asymmetric loss collapses the head to [0, 0.258]
# (Apr-25 bake-off Loss 1 failure mode).
#
# Training signal: per-frame ordinal labels y ∈ {1..5}, supervised via SYMMETRIC CORN
# (corn_asymmetric_c = 0 → α_k = 1 = β_k for all k). Both directions equally penalised
# so the head learns the full operating range, not just one tail.
#
# Output: progress_head state_dict saved at training.output_dir. Loaded by
# loss1_corn.yaml ablations via training.load_from_checkpoint pointing at this dir.
#
# Apply on top of train_lora_base.yaml. Recommended invocation:
#   sbatch jobs/pretrain_corn_head.job

# ---------- Head + loss ----------
model.progress_head_mode: corn
loss.progress_loss_type: corn_asymmetric
loss.corn_asymmetric_c: 0.0           # symmetric pretrain — equal weight on both directions

# pos_weight DELIBERATELY OFF (β_k=1). Earlier sanity run (May-1 22396654) showed
# pos_weight=sqrt(N_neg/N_pos) DEFEATS bias-init: with σ=p_k from bias-init, the
# expected gradient under β_k is -p(1-p)(β-1), driving σ toward β·p/(β·p+1-p) ≠ p.
# Observed: σ(z_5) drifted from prior 0.076 to 0.197 in 50 steps. With bias-init the
# only gradient we want is per-frame deviation from prior — pos_weight introduces an
# opposite drift.
# loss.corn_pos_weights: <intentionally unset>

# Bias-init the head's final-layer bias to logit(prior_k) so σ(z_k)=p_k at step 0
# for any input. Removes the σ=0.5 → "predict negative" pull on imbalanced thresholds
# that destroyed the Apr-30 pretrain. Mathematically, bias-init makes the entropy
# of the marginal the loss floor; only learnable per-frame signal drives further
# descent. Measured priors (50 batches, job 22395228): [0.602, 0.399, 0.209, 0.076].
loss.corn_bias_init_priors: [0.602, 0.399, 0.209, 0.076]

# ---------- Freeze everything except the progress head ----------
model.use_peft: false                  # no LoRA adapters
model.train_progress_head: true        # only this trains
model.train_success_head: false
model.train_preference_head: false
model.train_vision_encoder: false
model.train_language_model: false

# ---------- Backbone weights ----------
training.load_from_checkpoint: robometer/Robometer-4B

# ---------- ICL: ON (forces visual reading, breaks frame-index shortcut) ----------
# May-1 attempt 4: the previous 500-step pretrain (ICL off) produced σ_5 trajectories
# that were numerically IDENTICAL between success and failure queries (mean diff <1e-4
# per frame, std<1e-3 across trajectories at every frame position). The head learned
# σ = f(frame_index) and ignored visual content entirely.
#
# Hypothesis: with ICL on, every query frame's hidden state is conditioned (via cross-
# attention) on a different success demo. The same query frame_index now produces
# different hidden states across samples — the frame-index shortcut becomes unavailable
# and the head HAS to read visual content to fit the labels.
#
# Validation gate after this run: max |σ_5_mean[succ, frame i] − σ_5_mean[fail, frame i]|
# across i. Pass if > 0.02 with sensible direction (success ends higher). If < 0.005,
# ICL didn't break the shortcut — escalate to unfreezing top backbone layers.
data.use_icl: true
data.icl_prob: 1.0                     # always-on; forces every step to use cross-attention
data.pairs_index_path: /scratch-shared/pkarageorgis1/robometer_frames_splits/pairs_index_train_plus_failsafe.jsonl  # combined index so eval samples also get demos

# ---------- Data pipeline: same labels as Loss 1 LoRA bake-off ----------
data.failure_label_smoothing: none
data.success_label_noise_std: 0.1
data.stratified_batch_balance: true
data.warmup_steps: 0                   # no failure-only bootstrap

# ---------- Optimizer ----------
# AdamW. lr=1e-4 is 10× lower than the Apr-30 pretrain (1e-3), which over-corrected
# in the 10-step sanity (σ(z_3) reached 0.87 vs prior 0.40). With bias-init removing
# the early transient and pos_weights now correctly calibrated, a gentler lr lets
# the head settle smoothly. Warmup at 5% of 500 = 25 steps.
training.learning_rate: 1.0e-4
training.warmup_ratio: 0.05
training.weight_decay: 0.01

# ---------- Schedule ----------
# 500-step BUDGET CAP. Real stopping criterion is the verification check at the end.
training.max_steps: 500
training.eval_steps: 50                # sanity-check the head every 50 steps
training.custom_eval_steps: 50
training.per_device_train_batch_size: 8
training.gradient_accumulation_steps: 1

# Custom eval: keep policy_ranking on the failsafe split only — that's the cleanest
# label source (simulator-derived, no VLM noise) and small enough that the dual-ICL
# eval doesn't dominate wall time. The pretrain is about learning the rubric; demos
# are off, so dual-ICL collapses to two identical passes — turn it off.
custom_eval.eval_types: [policy_ranking]
custom_eval.policy_ranking: [robometer_frames_eval_failsafe]
custom_eval.policy_ranking_dual_icl: false
custom_eval.num_examples_per_quality_pr: 50

# ---------- Checkpoint saving ----------
training.save_strategy: steps
training.save_steps: 100               # 5 checkpoints over the 500-step run
training.overwrite_output_dir: true

training.exp_name: corn_head_pretrain
