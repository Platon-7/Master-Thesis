# Base Hydra overrides shared by every LoRA training run in the bake-off.
# Per-variant loss setup comes from loss1_corn.yaml or loss2_c51.yaml.
#
# IMPORTANT: This file is consumed by a sed-based line-to-CLI-override translator in the
# train_loss*.job scripts. Keep every list in inline [a,b,c] form — block lists (- item)
# break the flattening.

model.base_model_id: Qwen/Qwen3-VL-4B-Instruct
model.use_peft: true
# Loss 2 (Chris') trains both progress and success heads. Loss 1 (CORN) overrides
# train_success_head back to false in its preset. Preference head off for both variants.
model.train_progress_head: true
model.train_preference_head: false
model.train_success_head: true

# Splits built by scripts/build_splits.py. Each short name resolves to a preprocessed
# cache under $ROBOMETER_PROCESSED_DATASETS_PATH (/projects/prjs1958/robometer_frames_hf).
# `robometer_frames_warmup` was dropped Apr-30 — the loss configs now set
# data.warmup_steps=0 (no failure-only bootstrap), so the warmup pool would just sit
# unused. Dropping it also avoids loading 1.5k extra rows whose icl pair-coverage is
# 84% (below the 0.80 floor) — which would now correctly fail the drift sniff.
data.train_datasets: [robometer_frames_train]
data.eval_datasets: [robometer_frames_eval_droid,robometer_frames_eval_robometer,robometer_frames_eval_metaworld,robometer_frames_eval_failsafe]

# ICL: each sample can carry a 16-frame successful partner as in-context demo.
data.use_icl: true
data.icl_prob: 0.5
data.pairs_index_path: /scratch-shared/pkarageorgis1/robometer_frames_splits_3p5x/pairs_index_train.jsonl

# Augmentations — operate on frame indices, work with 16 keyframes.
# Order: [rewind, suboptimal, different_task, reverse_progress]
# Pure progress-style sampling (one trajectory per sample). Robometer's default is
# [1,0,0] = 100% preference (chosen+rejected pairs), which drives the preference head —
# we've disabled that head for both losses so we need the samples to match.
data.sample_type_ratio: [0,1,0]
data.preference_strategy_ratio: [1,1,1,1]
# Order: [different_task, forward, reverse, rewind]
data.progress_strategy_ratio: [1,1,1,1]

training.load_from_checkpoint: robometer/Robometer-4B
training.per_device_train_batch_size: 8
training.gradient_accumulation_steps: 2
training.learning_rate: 2.0e-5
training.warmup_ratio: 0.05
training.weight_decay: 0.01
training.max_steps: 7500
# eval cadence: every 500 steps (15 evals per 7500-step run, or 8 per 4000-step round).
# This is a finer cadence than the original 750-step setting — combined with dual-ICL eval
# (each eval round is run twice, once with icl_prob=1 and once with icl_prob=0) so we can
# track ICL benefit live during training.
training.eval_steps: 500
training.custom_eval_steps: 500
# Wire upstream Robometer's custom-eval suite to OUR rebuilt eval splits (each now contains
# both quality labels per task — see scripts/build_splits.py::_with_partners). This gives us
# losses.md's trajectory-level metrics live during training:
#   * policy_ranking    → ranking accuracy (#2)
#   * confusion_matrix  → per-class breakdown for ordinal MAE (#4)
#   * reward_alignment  → progress correlation, feeds calibration view of #3 (ECE)
# quality_preference is dropped because we don't train the preference head in this bake-off.
# custom_eval_steps=500 keeps overhead in check (~15 evals over a 7500-step run); standard
# per-frame eval still runs at training.eval_steps=50 for tight convergence tracking.
# Only policy_ranking — this is the losses.md §Winning-criterion metric (Success AUC +
# ranking accuracy + per-source slicing). confusion_matrix and reward_alignment are dropped:
# they expand to a 44k-batch-per-dataset cross-product (vs policy_ranking's ~24 batches),
# turning each eval round from ~5 min into ~30 hours, and their signal is redundant with
# what standard eval already logs (per-frame MAE + Spearman correlation).
custom_eval.eval_types: [policy_ranking]
custom_eval.policy_ranking: [robometer_frames_eval_droid,robometer_frames_eval_robometer,robometer_frames_eval_metaworld,robometer_frames_eval_failsafe]
# Bumped from 5 (default) so failsafe (3 tasks × 2 qualities × 85 = 510) lands at the
# user-requested ~500 trajectories per eval round. Other splits cap to their natural
# partnered-only pool size (eval_droid ≈ 489, metaworld ≈ 500, robometer ≈ 2,256).
custom_eval.num_examples_per_quality_pr: 85

# Eval batch size: dropped from the framework default of 16 to 4 because ICL doubles
# the per-sample image-token count (16 demo + 16 query → 32 frames → ~2× attention
# memory). The Apr-30 dual-eval smoke test OOM'd at batch=16; batch=4 fits with
# margin on a single H100.
training.per_device_eval_batch_size: 4
# Dual-ICL eval: when true, every policy_ranking eval round runs TWICE — once with
# icl_prob forced to 1.0 (ICL-on, every paired sample gets a demo) and once with
# icl_prob forced to 0.0 (ICL-off, no demos). Metrics emitted with `_iclon` and
# `_icloff` suffixes. Note: ignores data.icl_prob — eval is deterministic 1.0 vs 0.0,
# the training-time 0.5 coin-flip only applies during the training phase.
custom_eval.policy_ranking_dual_icl: true
training.overwrite_output_dir: true
training.save_strategy: steps
training.save_steps: 1000

logging.log_to: [wandb]
logging.wandb_project: Robometer_LoRA
logging.wandb_entity: nlp-squad
